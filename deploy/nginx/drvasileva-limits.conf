# Copy to /etc/nginx/conf.d/. Used by both the live sites and the test site.
# At most 5 contact-form submissions per minute per visitor
limit_req_zone $binary_remote_addr zone=drv_contact:1m rate=5r/m;
# Editor sign-in: at most 10 attempts per minute per visitor (the editor itself also locks after 5 wrong tries)
limit_req_zone $binary_remote_addr zone=drv_admin_login:1m rate=10r/m;
