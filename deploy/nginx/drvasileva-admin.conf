# The website editor: admin.drvasileva.co.uk → the editor service (server/admin_server.py) on 127.0.0.1:8788.
# Copy to /etc/nginx/conf.d/drvasileva-admin.conf. Needs drvasileva-limits.conf and the snippet drvasileva-admin-common.conf.

server {
    listen 80;
    listen [::]:80;
    server_name admin.drvasileva.co.uk;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.drvasileva.co.uk;
    ssl_certificate     /etc/letsencrypt/live/admin.drvasileva.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.drvasileva.co.uk/privkey.pem;
    include /etc/nginx/snippets/drvasileva-admin-common.conf;
}
