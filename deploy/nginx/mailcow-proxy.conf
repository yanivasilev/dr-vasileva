# Only needed if mailcow runs on the same VPS (see deploy/README.md, step 2).
# mailcow's own web server is moved to 127.0.0.1:8080 / 8443 and this host nginx passes
# the mail hostname through to it. Replace mail.example.com with your mailcow hostname.
# Mail itself (SMTP/IMAP ports 25, 465, 587, 993 …) does not go through nginx and is unaffected.
server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com autodiscover.* autoconfig.*;
    # mailcow gets and renews its own certificate through this
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.example.com autodiscover.* autoconfig.*;
    # mailcow's own certificate (path inside your mailcow folder, usually /opt/mailcow-dockerized)
    ssl_certificate     /opt/mailcow-dockerized/data/assets/ssl/cert.pem;
    ssl_certificate_key /opt/mailcow-dockerized/data/assets/ssl/key.pem;
    client_max_body_size 0;
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 64 512k;
        proxy_busy_buffers_size 512k;
    }
}
