# nginx config for a server behind a Cloudflare Tunnel (see deploy/README.md, "Behind a Cloudflare Tunnel").
# Cloudflare does HTTPS and the tunnel brings visitors to nginx here on port 80, so there are no certificates.
# Copy to /etc/nginx/sites-available/drvasileva, link it in sites-enabled, then: nginx -t && systemctl reload nginx
# Needs in /etc/nginx/conf.d/: drvasileva-limits.conf and the Cloudflare real-IP settings (cloudflare-realip.conf),
# and in /etc/nginx/snippets/: drvasileva-common.conf, drvasileva-blog-en.conf, drvasileva-blog-bg.conf, drvasileva-admin-common.conf.

# www → without www
server {
    listen 80;
    server_name www.drvasileva.co.uk;
    return 301 https://drvasileva.co.uk$request_uri;
}
server {
    listen 80;
    server_name www.drvasileva.bg;
    return 301 https://drvasileva.bg$request_uri;
}

# English site
server {
    listen 80;
    server_name drvasileva.co.uk;
    root /var/www/dr-vasileva/dist/en;
    include /etc/nginx/snippets/drvasileva-blog-en.conf;      # articles from the Admin Dashboard
    include /etc/nginx/snippets/drvasileva-common.conf;
}

# Bulgarian site
server {
    listen 80;
    server_name drvasileva.bg;
    root /var/www/dr-vasileva/dist/bg;
    include /etc/nginx/snippets/drvasileva-blog-bg.conf;      # статии от админ панела
    include /etc/nginx/snippets/drvasileva-common.conf;
}

# Admin Dashboard
server {
    listen 80;
    server_name admin.drvasileva.co.uk;
    include /etc/nginx/snippets/drvasileva-admin-common.conf;
}

# Test addresses: the same sites, hidden from search engines. Delete these blocks when you no longer need them.
server {
    listen 80;
    server_name drvasileva.vasilevdigital.com;
    root /var/www/dr-vasileva/dist/en;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/drvasileva-blog-en.conf;
    include /etc/nginx/snippets/drvasileva-common.conf;
}
server {
    listen 80;
    server_name drvasileva-bg.vasilevdigital.com;
    root /var/www/dr-vasileva/dist/bg;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/drvasileva-blog-bg.conf;
    include /etc/nginx/snippets/drvasileva-common.conf;
}
server {
    listen 80;
    server_name drvasileva-admin.vasilevdigital.com;
    include /etc/nginx/snippets/drvasileva-admin-common.conf;
}
