# Articles published from the editor, for drvasileva.co.uk (see deploy/README.md step 9).
# Copy to /etc/nginx/snippets/ and include it in the drvasileva.co.uk server block (and the matching test server block).
# These addresses then come from the editor's folder instead of dist/en, so new and changed posts appear at once.
location = /articles { root /var/www/drvasileva-blog/en; try_files /articles/index.html =404; }
location ^~ /articles/ { root /var/www/drvasileva-blog/en; try_files $uri $uri/index.html =404; }
location ^~ /images/posts/ { root /var/www/drvasileva-blog/en; expires 30d; }
location = /posts.json { root /var/www/drvasileva-blog/en; expires epoch; }
location = /sitemap-articles.xml { root /var/www/drvasileva-blog/en; }
