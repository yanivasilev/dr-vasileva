# Temporary config, only for getting the first certificates (see deploy/README.md, step 4).
# The full config refers to certificate files that don't exist yet, so nginx won't start with it on day one.
# Copy to /etc/nginx/conf.d/drvasileva.conf, run certbot, then replace it with drvasileva.conf.
server {
    listen 80;
    listen [::]:80;
    server_name drvasileva.co.uk www.drvasileva.co.uk drvasileva.bg www.drvasileva.bg admin.drvasileva.co.uk;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503; }
}
