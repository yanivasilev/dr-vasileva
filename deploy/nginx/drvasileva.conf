# nginx config for drvasileva.co.uk (English) and drvasileva.bg (Bulgarian).
# Copy to /etc/nginx/conf.d/drvasileva.conf (or sites-available + symlink), then: nginx -t && systemctl reload nginx
# Assumes the repository is at /var/www/dr-vasileva and Let's Encrypt certificates from certbot.

# At most 5 contact-form submissions per minute per visitor
limit_req_zone $binary_remote_addr zone=drv_contact:1m rate=5r/m;

# HTTP: certificates and redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name drvasileva.co.uk www.drvasileva.co.uk drvasileva.bg www.drvasileva.bg;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# www → without www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.drvasileva.co.uk;
    ssl_certificate     /etc/letsencrypt/live/drvasileva.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drvasileva.co.uk/privkey.pem;
    return 301 https://drvasileva.co.uk$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.drvasileva.bg;
    ssl_certificate     /etc/letsencrypt/live/drvasileva.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drvasileva.bg/privkey.pem;
    return 301 https://drvasileva.bg$request_uri;
}

# English site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drvasileva.co.uk;
    root /var/www/dr-vasileva/dist/en;
    ssl_certificate     /etc/letsencrypt/live/drvasileva.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drvasileva.co.uk/privkey.pem;
    include /etc/nginx/snippets/drvasileva-common.conf;
}

# Bulgarian site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drvasileva.bg;
    root /var/www/dr-vasileva/dist/bg;
    ssl_certificate     /etc/letsencrypt/live/drvasileva.bg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drvasileva.bg/privkey.pem;
    include /etc/nginx/snippets/drvasileva-common.conf;
}
