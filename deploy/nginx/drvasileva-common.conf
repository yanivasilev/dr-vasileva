# Shared settings for both sites. Copy to /etc/nginx/snippets/drvasileva-common.conf

index index.html;
charset utf-8;

# Real page addresses: /about → /about/index.html; anything else → the 404 page (with a 404 status)
location / {
    try_files $uri $uri/index.html =404;
}
error_page 404 /404.html;
location = /404.html { internal; }

# Contact form → the Python service (server/contact_server.py)
location = /api/contact {
    limit_req zone=drv_contact burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# The site's code (app-<fingerprint>.js): its name changes with every update, so browsers may keep it for a year
location ~ ^/app-[0-9a-f]+\.js$ {
    expires 365d;
}

# Images and icons can be cached by browsers
location /images/ {
    expires 30d;
}
location /fonts/ {
    expires 365d;
}

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
