# Test copy of both sites on your own domain, before drvasileva.co.uk / drvasileva.bg point here:
#   drvasileva.vasilevdigital.com     → English  (dist/en)
#   bg.drvasileva.vasilevdigital.com  → Bulgarian (dist/bg)
# The EN / BG switch moves between the two. Search engines are told not to index the test site.
# Needs drvasileva-limits.conf in /etc/nginx/conf.d/ and the snippet drvasileva-common.conf.

server {
    listen 80;
    listen [::]:80;
    server_name drvasileva.vasilevdigital.com bg.drvasileva.vasilevdigital.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drvasileva.vasilevdigital.com;
    root /var/www/dr-vasileva/dist/en;
    ssl_certificate     /etc/letsencrypt/live/drvasileva.vasilevdigital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drvasileva.vasilevdigital.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/drvasileva-common.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bg.drvasileva.vasilevdigital.com;
    root /var/www/dr-vasileva/dist/bg;
    ssl_certificate     /etc/letsencrypt/live/drvasileva.vasilevdigital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drvasileva.vasilevdigital.com/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/drvasileva-common.conf;
}
