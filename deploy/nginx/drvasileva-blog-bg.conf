# Articles published from the editor, for drvasileva.bg (see deploy/README.md step 9).
# Copy to /etc/nginx/snippets/ and include it in the drvasileva.bg server block (and the matching test server block).
# These addresses then come from the editor's folder instead of dist/bg, so new and changed posts appear at once.
location = /statii { root /var/www/drvasileva-blog/bg; try_files /statii/index.html =404; }
location ^~ /statii/ { root /var/www/drvasileva-blog/bg; try_files $uri $uri/index.html =404; }
location ^~ /images/posts/ { root /var/www/drvasileva-blog/bg; expires 30d; }
location = /posts.json { root /var/www/drvasileva-blog/bg; expires epoch; }
location = /sitemap-articles.xml { root /var/www/drvasileva-blog/bg; }
