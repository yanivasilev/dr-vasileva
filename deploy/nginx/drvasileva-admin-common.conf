# Shared settings for the editor (admin.drvasileva.co.uk and the test address).
# Copy to /etc/nginx/snippets/drvasileva-admin-common.conf
# The editor sends its own security headers (CSP, no framing, no caching, noindex); nginx adds HTTPS-only.
add_header Strict-Transport-Security "max-age=31536000" always;
client_max_body_size 12m;          # a post with its cover photo
server_tokens off;

location = /login {
    limit_req zone=drv_admin_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location / {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
